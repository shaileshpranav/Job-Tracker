<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Job Tracker</title>
<script>try{const t=localStorage.getItem("theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="stylesheet" href="/fonts/plex.css">
<style>
  :root { --bg:#f1f1ee; --panel:#fbfbfa; --ink:#17181a; --ink-2:#3c3d41; --mute:#6c6e73; --line:#dadad5; --accent:#2f4a9e; --accent-soft:#e4e9f6; --bad:#a8382c; }
  [data-theme="dark"] { --bg:#141517; --panel:#1c1d20; --ink:#e9e9e6; --ink-2:#c4c4c0; --mute:#97989c; --line:#2e3035; --accent:#9fb0ff; --accent-soft:#252c47; --bad:#ee7466; color-scheme:dark; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#141517; --panel:#1c1d20; --ink:#e9e9e6; --ink-2:#c4c4c0; --mute:#97989c; --line:#2e3035; --accent:#9fb0ff; --accent-soft:#252c47; --bad:#ee7466; color-scheme:dark; } }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:16px; font:14px/1.5 "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:26px 24px 22px; width:min(340px, 100%); }
  h1 { font:600 20px/1.2 "IBM Plex Serif", Georgia, serif; margin:0 0 4px; letter-spacing:-.005em; }
  p.muted { color:var(--mute); margin:0 0 18px; font-size:13px; }
  input { font:inherit; width:100%; padding:9px 11px; border:1px solid var(--line); border-radius:6px; background:var(--panel); color:var(--ink); margin-bottom:10px; }
  input:focus { outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button { font:inherit; font-weight:500; width:100%; padding:9px 11px; border:1px solid var(--ink); border-radius:6px; background:var(--ink); color:var(--bg); cursor:pointer; }
  button:hover:not(:disabled) { background:var(--ink-2); border-color:var(--ink-2); }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  button:disabled { opacity:.6; cursor:default; }
  .err { color:var(--bad); font-size:13px; margin:0 0 10px; min-height:16px; }
  @media (max-width:768px) { input, button { font-size:16px; } }
</style>
</head>
<body>
  <form class="card" id="f">
    <h1>Job Tracker</h1>
    <p class="muted">Enter your password to open the tracker.</p>
    <p class="err" id="err"></p>
    <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
    <button id="go">Log in</button>
  </form>
<script>
  const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err"), go = document.getElementById("go");
  f.onsubmit = async (e) => {
    e.preventDefault();
    err.textContent = ""; go.disabled = true; go.textContent = "Checking…";
    try {
      const res = await fetch("/api/login", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: pw.value }) });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.error || "Incorrect password");
      location.reload(); // keep the URL (e.g. ?capture=wait from the bookmarklet)
    } catch (e) { err.textContent = e.message; go.disabled = false; go.textContent = "Log in"; }
  };
</script>
</body>
</html>
